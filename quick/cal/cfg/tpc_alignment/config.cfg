/* Keep TPC21 and TPC23 as the "references", only try calibrate 22 and 24. */
GLOBAL() {
    -f caldir/tof_cal/good/expert_trigger_frsdet_0001.root,
       caldir/tof_cal/good/expert_trigger_with_target_12.root,
       caldir/tof_cal/good/expert_trigger_with_target_3.root
    --ref=21:1,1;23:1,1
    --sci21=2650,3550
    --sci22=2370,3250
    --niter=3
    --save=png
}

SECTION(tpc22) {
    -i 1
    -f !caldir/tof_cal/good/expert_trigger_frsdet_0001.root,
        caldir/tof_cal/good/expert_trigger_with_target_12.root,
        caldir/tof_cal/good/expert_trigger_with_target_3.root,
        caldir/tof_cal/good/expert_trigger_with_target_4.root
    --fit-range-x=-13,13
    --fit-range-y=-13,13
}
SECTION(tpc24) {
    -i 3
    --fit-range-x=-10,10
    --fit-range-y=-10,10
}
