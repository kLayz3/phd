GLOBAL() {
    -f
    caldir/tof_cal/good/expert_trigger_frsdet_0001.root,     // only detectors
    caldir/tof_cal/good/expert_trigger_with_target_1_2.root, // detectors + primary target
    caldir/tof_cal/good/expert_trigger_with_target_3.root    // detectors + primary target + s1 deg

    --dt-cut-22-31=270,-63.5,-59.5
    --dt-cut-21-22=240,44.5,46
    --ref=21:1,1;23:1,1
    --niter=3
    --sratio=2.0
	--charge
	--qhist-range=0:200,2200,3800;1:207,2000,3400;2:202,1301,2000
    -opng,root
}

SECTION(qdc_cal) {
	-f
    !caldir/tof_cal/good/expert_trigger_frsdet_0001.root,     // only detectors
     caldir/tof_cal/good/expert_trigger_with_target_1_2.root, // detectors + primary target
     caldir/tof_cal/good/expert_trigger_with_target_3.root    // detectors + primary target + s1 deg
     caldir/tof_cal/good/expert_trigger_with_target_4.root    // detectors + primary target + s1 deg + EXPERT
	--charge
}
