GLOBAL() {
	-f
	hitdir/main_0019_0022.root
	hitdir/main_0023_0032.root
	hitdir/main_0033_0038.root
	hitdir/main_0039_0048.root
	hitdir/main_0049_0050.root
	hitdir/main_0051_0085.root
	hitdir/main_0086_0106.root
	hitdir/main_0107_0117.root
	hitdir/main_0118_0126.root
	hitdir/main_0127_0155.root
	hitdir/main_0156_0192.root
	--sci21=2700,3700 // gate on single hit SCI21 and 9C region.
	-o !png,root
}

SECTION(all) {
	--angle=all
	-i all
	--nthreads=10
	--sci21='~' // reset the option :)
}
SECTION(all_vertexed) {
	--angle=all
	-i all_vertexed
	--nthreads=10
	--distance=1.1
	--sci21='~' // reset the option :)
}
SECTION(all_with_s3) {
	--angle=all
	-i all_with_s3
	--sci31=0,5000
}
SECTION(all_with_s3_vertexed) {
	--angle=all
	-i all_with_s3_vertexed
	--sci31=0,5000
	--distance=1.1
}
SECTION(all_6li_s3) {
	--angle=all
	-i all_6li_s3 //info
	--sci31=2300,3500 // gate on single hit SCI21 and 9C region.
}

SECTION(6li_2p) {
	--angle=p
	--select=Li,1:H,2
	--distance=1.4
	-i 6li_2p //info
	--sci31=2300,3500 // gate on single hit SCI31 and 6Li region.

	--rho-binning=100,0,200
	--rho-xlabel='$\rho\,[\mathrm{mrad}]$'
	--rho-title='$\rho = \sqrt{\theta_{p0,\mathrm{^6Li}}^2 + \theta_{p1,\mathrm{^6Li}}^2}$'
	--nthreads=6
}
SECTION(6li_2p_no_s3gate) {
	--angle=p
	--select=Li,1:H,2
	--distance=1.1
	-i 6li_2p_no_s3gate //info

	--rho-binning=100,0,200
	--rho-xlabel='$\rho\,[\mathrm{mrad}]$'
	--rho-title='$\rho = \sqrt{\theta_{p0,\mathrm{^6Li}}^2 + \theta_{p1,\mathrm{^6Li}}^2}$'
	--nthreads=6
}
SECTION(3he3) {
	--select He,3
	--distance=1.2
	--angle=p
	--allow-others
	-i 3he3 //info
}
SECTION(9c_into_7be2p) {
	--select=Be,1:H,2
	--distance=0.9
	--angle=p
	--rho-binning=100,0,200
	--rho-xlabel='$\rho\,[\mathrm{mrad}]$'
	--rho-title='$\rho = \sqrt{\theta_{p0,\mathrm{^7Be}}^2 + \theta_{p1,\mathrm{^7Be}}^2}$'
	--nthreads=6
	-i 7be2p //info
}
SECTION(1he2p) {
	--select=He,1:H,2
	--distance=1.0
	--angle=p
	-i 1he2p //info
	--sci31=800,1800 // gate on SCI31 also!
	--sci21=!'~'
	--rho-binning=180,0,180
	--rho-xlabel='$\rho\,[\mathrm{mrad}]$'
	--rho-title='$\rho = \sqrt{\theta_{p0,\mathrm{^4He}}^2 + \theta_{p1,\mathrm{^4He}}^2}$'
	--nthreads=100 // will automatically limit itself nfiles :)
}
SECTION(1he3p) {
	--select=He,1:H,3
	--distance=1.2
	--angle=p
	//--allow-others
	-i 1he3p //info
	--nthreads=11
}
SECTION(1he4p) {
	--select=He,1:H,4
	--distance=1.1
	--angle=p
	//--allow-others
	--nthreads=6
	--rho-xlabel='$\rho\,[\mathrm{mrad}]$'
	--rho-title='$\rho = \sqrt{\sum_{i=1}^{4}\theta_{p(i),\mathrm{^4He}}^2}$'
	-i 1he4p //info
}

SECTION(8b_into_7be1p) {
	--select=Be,1:H,1
	--distance=0.4
	--nthreads=8
	--angle=p
	--rho-binning=180,0,100

	--rho-xlabel='$\theta_{p0,\mathrm{^8B}}\,[\mathrm{mrad}]$'
	--rho-title='$\rho = \sqrt{\theta_{p0,\mathrm{^7Be}}^2} = \theta_{p0,\mathrm{^7Be}}$'
	--py-fillcol=0xD675FF,0.55
	-i 7be1p_new //info
}
