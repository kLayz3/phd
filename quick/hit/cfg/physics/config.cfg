// Enable or disable the QDC of scintillators to be expressed
// as calibrated Q-value instead of QDC value.
#define MEASURE_IN_Q

#if defined(MEASURE_IN_Q)
#undef MEASURE_IN_QDC
#elif !defined(MEASURE_IN_QDC)
#define MEASURE_IN_QDC
#endif

#include "sci_cuts.hh"


GLOBAL() {
	-f
	hitdir/main_0019_0022.root
	hitdir/main_0023_0032.root
	hitdir/main_0033_0038.root
	hitdir/main_0039_0048.root
	hitdir/main_0049_0050.root
	hitdir/main_0051_0085.root
	hitdir/main_0086_0106.root
	hitdir/main_0107_0117.root
	hitdir/main_0118_0126.root
	hitdir/main_0127_0155.root
	hitdir/main_0156_0192.root

#ifdef MEASURE_IN_QDC
	--sci-qdc
	--sci21=SCI21_QDC_CUT_C_LO,SCI21_QDC_CUT_C_HI
#else
	--sci-q
	--sci21=SCI21_Q_CUT_C_LO,SCI21_Q_CUT_C_HI
#endif
	-o !png,root
}

SECTION(all) {
	-i all
	--nthreads=10
	--sci21='~' // reset the option :)
	--q-binning=70,0,7
	--hide-platex-coeffs
}
SECTION(all_vertexed) {
	-i all_vertexed
	--nthreads=10
	--distance=0.6
	--sci21='~' // reset the option :)
	--q-binning=70,0,7
	--hide-platex-coeffs
}

SECTION(all_with_s3) {
	--angle=all
	-i all_with_s3
#ifdef MEASURE_IN_QDC
	--sci31=SCI_QDC_CUT_ALL_LO,SCI_QDC_CUT_ALL_HI
#else
	--sci31=SCI_Q_CUT_ALL_LO,SCI_Q_CUT_ALL_HI
#endif
}

SECTION(all_with_s3_li_cut) {
	-i all_with_s3
#ifdef MEASURE_IN_QDC
	--sci31=SCI31_QDC_CUT_LI_LO,SCI31_QDC_CUT_LI_HI
#else
	--sci31=SCI31_Q_CUT_LI_LO,SCI31_Q_CUT_LI_HI
#endif
	-i all_with_s3_li_cut //info
	--nthreads 10
}

SECTION(all_with_s3_he_cut) {
	-i all_with_s3
#ifdef MEASURE_IN_QDC
	--sci31=SCI31_QDC_CUT_HE_LO,SCI31_QDC_CUT_HE_HI
#else
	--sci31=SCI31_Q_CUT_HE_LO,SCI31_Q_CUT_HE_HI
#endif
	-i all_with_s3_he_cut //info
	--nthreads 10
}

SECTION(all_with_s3_vertexed) {
	-i all_with_s3_vertexed
#ifdef MEASURE_IN_QDC
	--sci31=SCI_QDC_CUT_ALL_LO,SCI_QDC_CUT_ALL_HI
#else
	--sci31=SCI_Q_CUT_ALL_LO,SCI_Q_CUT_ALL_HI
#endif
	--distance=1.1
}

SECTION(all_6li_s3) {
#ifdef MEASURE_IN_QDC
	--sci31=SCI31_QDC_CUT_LI_LO,SCI31_QDC_CUT_LI_HI
#else
	--sci31=SCI31_Q_CUT_LI_LO,SCI31_Q_CUT_LI_HI
#endif
	-i all_6li_s3 //info
}

SECTION(6li_1p) {
	--select=6Li,1:1H,1
	--distance=0.6
#ifdef MEASURE_IN_QDC
	--sci31=SCI31_QDC_CUT_LI_LO,SCI31_QDC_CUT_LI_HI
#else
	--sci31=SCI31_Q_CUT_LI_LO,SCI31_Q_CUT_LI_HI
#endif
	--rho-binning=400,0,200
	--nthreads=6
	--scaling
	--fmt-isotope
	-i 6li_1p //info
}

/* ====================== */
SECTION(3he3) {
	--select=3He,3
	--distance=0.5
	--nthreads=8

	--scaling
	--fmt-isotope
	--rho-binning=300,0,300
	-q He:1.64,2.6 // shift helium a little bit.
	-i 3he3 //info
}
/* ====================== */

SECTION(1he1p) {
	--select=4He,1:1H,1
	--distance=0.4

#ifdef MEASURE_IN_QDC
	--sci31=SCI31_QDC_CUT_HE_LO,SCI31_QDC_CUT_HE_HI
#else
	--sci31=SCI31_Q_CUT_HE_LO,SCI31_Q_CUT_HE_HI
#endif

	--rho-binning=300,0,100
	--nthreads=100 // will automatically limit itself nfiles :)
	-i 1he1p
}

SECTION(1he2p) {
	--select=4He,1:1H,2
	--distance=0.4

#ifdef MEASURE_IN_QDC
//	--sci31=SCI31_QDC_CUT_HE_LO,SCI31_QDC_CUT_HE_HI
#else
//	--sci31=SCI31_Q_CUT_HE_LO,SCI31_Q_CUT_HE_HI
#endif


	--sci21=!'~'
	--rho-binning=180,0,180
	--nthreads=100 // will automatically limit itself nfiles :)
	-i 1he2p //info
}

// 7B → 4He + 3p ; possibly new!
SECTION(1he3p) {
	--select=4He,1:1H,3
	--distance=0.6
	--rho-binning=250,0,250
	-i 1he3p //info
	--nthreads=8
	--scaling
	--fmt-isotope
}

SECTION(1he4p) {
	--select=4He,1:1H,4
	--distance=1.1
	--nthreads=6
	-i 1he4p //info
}

/* Good 2p emitter. */
SECTION(6li_2p) {
	--select=6Li,1:1H,2
	--distance=0.6
	-i 6li_2p //info

#ifdef MEASURE_IN_QDC
	--sci31=SCI31_QDC_CUT_LI_LO,SCI31_QDC_CUT_LI_HI
#else
	--sci31=SCI31_Q_CUT_LI_LO,SCI31_Q_CUT_LI_HI
#endif

	--scaling
	--fmt-isotope
	--rho-tstyle=132,0.044
	--rho-binning=100,0,200
	--nthreads=10
}

SECTION(6li_2p_no_s3) {
	--select=6Li,1:1H,2
	--distance=0.6
	-i 6li_2p_no_s3 //info
	--sci21='!~' // reset

	--scaling
	--fmt-isotope
	--rho-tstyle=132,0.044
	--rho-binning=100,0,200
	--nthreads=10
}

/* Possible 2p- emitter? */
SECTION(9c_into_7be2p) {
	--select=7Be,1:1H,2
	--distance=0.6
	--rho-binning=180,0,200
	--nthreads=8
	--scaling
	--fmt-isotope
	-i 7be2p //info
}

/* Calibration channel! */
SECTION(8b_into_7be1p) {
	--select=7Be,1:1H,1
	--distance=0.4
	--nthreads=8
	--rho-binning=180,0,100
	--scaling
	--fmt-isotope
	--py-fillcol=0xD675FF,0.73
	-i 7be1p //info
}
