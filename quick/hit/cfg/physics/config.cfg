GLOBAL() {
	-f
	hitdir/main_0019_0022.root
	hitdir/main_0023_0032.root
	hitdir/main_0033_0038.root
	hitdir/main_0039_0048.root
	hitdir/main_0049_0050.root
	hitdir/main_0051_0085.root
	hitdir/main_0086_0106.root
	hitdir/main_0107_0117.root
	hitdir/main_0118_0126.root
	hitdir/main_0127_0155.root
	hitdir/main_0156_0192.root
	--sci21=2700,3700 // gate on single hit SCI21 and 9C region.
	-o !png,root
}

SECTION(all) {
	-i all
	--nthreads=10
	--sci21='~' // reset the option :)
}
SECTION(all_vertexed) {
	-i all_vertexed
	--nthreads=10
	--distance=0.8
	--sci21='~' // reset the option :)
}
SECTION(all_with_s3) {
	--angle=all
	-i all_with_s3
	--sci31=0,5000
}
SECTION(all_with_s3_li_cut) {
	-i all_with_s3
	--sci31=2300,3500 // gate on single hit SCI31 and 6Li region.
	-i all_with_s3_li_cut //info
	--nthreads 10
}
SECTION(all_with_s3_he_cut) {
	-i all_with_s3
	--sci31=800,1800 // gate on SCI31 also!
	-i all_with_s3_he_cut //info
	--nthreads 10
}
SECTION(all_with_s3_vertexed) {
	--angle=all
	-i all_with_s3_vertexed
	--sci31=0,5000
	--distance=1.1
}
SECTION(all_6li_s3) {
	--angle=all
	-i all_6li_s3 //info
	--sci31=2300,3500 // gate on single hit SCI21 and 9C region.
}

SECTION(6li_1p) {
	--select=6Li,1:1H,1
	--distance=0.6
	--sci31=2300,3500 // gate on single hit SCI31 and 6Li region.
	--rho-binning=400,0,200
	--nthreads=6
	--scaling
	--fmt-isotope
	-i 6li_1p //info
}

SECTION(6li_2p_no_s3gate) {
	--angle=p
	--select=Li,1:H,2
	--distance=1.1
	-i 6li_2p_no_s3gate //info

	--rho-binning=100,0,200
	--rho-xlabel='$\rho\,[\mathrm{mrad}]$'
	--rho-title='$\rho = \sqrt{\theta_{p0,\mathrm{^6Li}}^2 + \theta_{p1,\mathrm{^6Li}}^2}$'
	--nthreads=6
}
SECTION(3he3) {
	--select 3He,3
	--distance=1.0
	--nthreads=6
	--fmt-isotope
	-i 3he3 //info
}
SECTION(1he1p) {
	--select=4He,1:1H,1
	--distance=0.4
	--sci31=800,1800 // gate on SCI31 also!
	--sci21=!'~'
	--rho-binning=300,0,100
	--nthreads=100 // will automatically limit itself nfiles :)
	-i 1he1p //info
}
SECTION(1he2p) {
	--select=4He,1:1H,2
	--distance=0.8
	--sci31=800,1800 // gate on SCI31 also!
	--sci21=!'~'
	--rho-binning=180,0,180
	--nthreads=100 // will automatically limit itself nfiles :)
	-i 1he2p //info
}
SECTION(1he3p) {
	--select=He,1:H,3
	--distance=1.2
	--angle=p
	--rho-binning=250,0,250
	-i 1he3p //info
	--nthreads=8
}
SECTION(1he4p) {
	--select=4He,1:1H,4
	--distance=1.1
	--nthreads=6
	-i 1he4p //info
}

/* Good 2p emitter. */
SECTION(6li_2p) {
	--select=6Li,1:1H,2
	--distance=0.6
	-i 6li_2p //info
	--sci31=2300,3500 // gate on single hit SCI31 and 6Li region.
	--scaling
	--fmt-isotope
	--rho-tstyle=132,0.044
	--rho-binning=100,0,200
	--nthreads=10
}

/* Possible 2p- emitter? */
SECTION(9c_into_7be2p) {
	--select=7Be,1:1H,2
	--distance=0.8
	--rho-binning=180,0,200
	--nthreads=8
	--scaling
	--fmt-isotope
	-i 7be2p //info
}

/* Calibration channel! */
SECTION(8b_into_7be1p) {
	--select=7Be,1:1H,1
	--distance=0.4
	--nthreads=8
	--rho-binning=180,0,100
	--scaling
	--fmt-isotope
	--py-fillcol=0xD675FF,0.73
	-i 7be1p_new_new //info
}
